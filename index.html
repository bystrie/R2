<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Продолжить</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#1a202c,#4a1d96);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { padding: 24px; max-width: 360px; }
    a {
      display: block;
      margin: 16px 0;
      padding: 16px;
      border-radius: 12px;
      background: white;
      color: #292050;
      font-weight: bold;
      text-decoration: none;
    }
    .secondary {
      background: transparent;
      border: 1px solid white;
      color: white;
    }
  </style>
</head>
<body>
<main>
  <h2>Продолжить знакомство</h2>
  <p>Откройте сайт в браузере</p>

  <a id="chrome" href="#">Открыть в Chrome</a>

  <a id="fallback" class="secondary" href="#">
    Продолжить на сайт
  </a>
</main>

<script>
  const target =
    "https://stripw.top/click?o=2&a=8146&sub_id2=S2";

  const intent =
    "intent://" +
    target.replace(/^https?:\/\//, "") +
    "#Intent;scheme=https;" +
    "package=com.android.chrome;" +
    "S.browser_fallback_url=" +
    encodeURIComponent(target) +
    ";end";

  const isAndroid = /android/i.test(navigator.userAgent);

  const chrome = document.getElementById("chrome");
  const fallback = document.getElementById("fallback");

  chrome.href = intent;
  fallback.href = target;

  if (!isAndroid) {
    chrome.style.display = "none";
  }
</script>
</body>
</html>
